<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover">
<meta name="description" content="ระบบสารสนเทศสำนักงานอิเล็กทรอนิกส์ โรงเรียนพิมานพิทยาสรรค์ - PHIMAN SMART OFFICE">
<meta name="theme-color" content="#dcdee1">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PHIMAN SMART OFFICE</title>
<link rel="icon" type="image/png" href="https://img2.pic.in.th/logo-app07b60eedf43429fe.png">
<link rel="apple-touch-icon" href="https://img2.pic.in.th/logo-app07b60eedf43429fe.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f7;
    --bg-elev:#ffffff;
    --text:#1d1d1f;
    --text-secondary:#6e6e73;
    --blue:#0071e3;
    --blue-dark:#0059b3;
    --card-bg:rgba(255,255,255,0.66);
    --card-bg-hover:rgba(255,255,255,0.86);
    --card-border:rgba(0,0,0,0.06);
    --divider:rgba(0,0,0,0.08);
    --shadow-sm:0 2px 10px rgba(0,0,0,0.04);
    --shadow-md:0 12px 36px rgba(0,0,0,0.10);
    --shadow-lg:0 20px 60px rgba(0,0,0,0.14);
    --header-h:320px; /* ค่าประมาณเริ่มต้น จะถูกอัปเดตแม่นยำด้วย JS ทันทีที่โหลด */
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden; width:100%; scroll-behavior: smooth;}
  html,body{margin:0;padding:0;}
  body{
    background: #c7c9cc;  /* fallback for old browsers */
    background: linear-gradient(135deg,
      #eef0f2 0%,
      #cfd2d6 12%,
      #fbfcfd 24%,
      #b8bbc0 36%,
      #e8eaec 48%,
      #a9acb2 60%,
      #f4f5f7 72%,
      #c2c5ca 84%,
      #eceef0 100%);
    background-size: 340% 340%;
    animation: silverShift 16s ease-in-out infinite;
    background-attachment: fixed;
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Noto Sans Thai', 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- glossy shine sweep overlay (ให้พื้นหลังสีเงินดูมันวาว ไม่ด้าน) ---------- */
  body::before{
    content:'';
    position:fixed;
    inset:-60% -60% -60% -60%;
    z-index:0;
    pointer-events:none;
    background:
      linear-gradient(115deg,
        transparent 25%,
        rgba(255,255,255,0.55) 44%,
        rgba(255,255,255,0.95) 50%,
        rgba(255,255,255,0.55) 56%,
        transparent 75%);
    background-size: 220% 220%;
    mix-blend-mode: overlay;
    animation: shineSweep 7s ease-in-out infinite;
    will-change: background-position;
  }
  @keyframes silverShift{
    0%{ background-position:0% 30%; }
    50%{ background-position:100% 70%; }
    100%{ background-position:0% 30%; }
  }
  @keyframes shineSweep{
    0%{ background-position:-120% -120%; }
    50%{ background-position:120% 120%; }
    100%{ background-position:-120% -120%; }
  }
  @media (prefers-reduced-motion: reduce){
    body{ animation:none; }
    body::before{ animation:none; }
    #splash{ animation:splashOut 0.45s ease forwards; animation-delay:9.8s; }
    #splash::before{ animation:none; }
  }
  ::selection{background:var(--blue); color:#fff;}

  /* ---------- soft aurora background ---------- */
  .aurora{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .aurora span{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:0.35;
    animation:drift 22s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1){ width:520px; height:520px; top:-160px; left:-120px; background:#0071e300; }
  .aurora span:nth-child(2){ width:460px; height:460px; top:120px; right:-160px; background:#ff375f00; animation-delay:-6s; }
  .aurora span:nth-child(3){ width:480px; height:480px; bottom:-200px; left:30%; background:#ffd60a00; animation-delay:-12s; opacity:0.22; }
  @keyframes drift{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(40px,-30px) scale(1.08); }
  }

  /* ---------- intro: apple-style hand-drawn hello ---------- */
  #splash{
    position:fixed; inset:0; z-index:100;
    background: #c7c9cc;
    background: linear-gradient(135deg,
      #eef0f2 0%,
      #cfd2d6 12%,
      #fbfcfd 24%,
      #b8bbc0 36%,
      #e8eaec 48%,
      #a9acb2 60%,
      #f4f5f7 72%,
      #c2c5ca 84%,
      #eceef0 100%);
    background-size: 340% 340%;
    animation: splashOut 0.9s ease forwards, silverShift 16s ease-in-out infinite;
    animation-delay:9.8s, 0s;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #splash::before{
    content:'';
    position:absolute; inset:-60%;
    z-index:0;
    pointer-events:none;
    background:
      linear-gradient(115deg,
        transparent 25%,
        rgba(255,255,255,0.55) 44%,
        rgba(255,255,255,0.95) 50%,
        rgba(255,255,255,0.55) 56%,
        transparent 75%);
    background-size: 220% 220%;
    mix-blend-mode: overlay;
    animation: shineSweep 7s ease-in-out infinite;
    will-change: background-position;
  }
  #splash.skip-out{ animation:splashOut 0.45s ease forwards !important; animation-delay:0s !important; }
  #splash.skip-out *{ animation-play-state:paused !important; }
  #splash.skip-out::before{ animation-play-state:paused !important; }
  #splash > div{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }

  #skipIntro{
    position:fixed; z-index:101;
    right:max(18px, env(safe-area-inset-right));
    bottom:max(18px, env(safe-area-inset-bottom));
    padding:10px 18px; border-radius:999px;
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(0,0,0,0.08);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:var(--text); font:600 13px/1 'Inter','Noto Sans Thai',sans-serif;
    cursor:pointer; opacity:0; box-shadow:var(--shadow-sm);
    animation:fadeUp 0.6s ease forwards; animation-delay:1.4s;
    transition:transform 0.2s, background 0.2s;
  }
  #skipIntro:hover{ background:rgba(255,255,255,0.95); transform:translateY(-2px); }
  #skipIntro:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; }

  #helloStage{ animation:stageOut 0.6s ease forwards; animation-delay:3.6s; }
  #helloStage svg{ width:min(70vw, 420px); height:auto; color:var(--text); }
  #helloStage svg path{
    stroke-dasharray:1400; stroke-dashoffset:1400;
    opacity:0;
  }
  @keyframes helloFadeIn{ to{ opacity:1; } }
  /* h1: duration 0.8s delay 0s, opacity duration 0.4s delay 0s */
  #helloStage svg path.p1{
    animation:
      draw 0.8s ease-in-out 0s forwards,
      helloFadeIn 0.4s ease 0s forwards;
  }
  /* h2 + ello: duration 2.8s delay 0.7s, opacity duration 0.7s delay 0.7s */
  #helloStage svg path.p2{
    animation:
      draw 2.8s ease-in-out 0.7s forwards,
      helloFadeIn 0.7s ease 0.7s forwards;
  }

  #sawasdeeStage{
    opacity:0;
    animation:stageIn 0.3s ease forwards, stageOut 0.5s ease forwards;
    animation-delay:4.0s, 7.6s;
  }
  #sawasdeeStage svg{ width:min(60vw, 340px); height:auto; color:var(--text); }
  #sawasdeeStage svg path{
    stroke-dasharray:19000; stroke-dashoffset:19000;
    animation:draw 3s ease forwards;
    animation-delay:4.3s;
  }

  #welcomeStage{
    opacity:0;
    animation:stageIn 0.9s ease forwards;
    animation-delay:8.0s;
  }
  #welcomeStage img{
    width:64px; height:64px; object-fit:contain; border-radius:16px;
    box-shadow:var(--shadow-md);
  }
  #welcomeStage .eyebrow{
    font-size:15px; color:var(--text-secondary); font-weight:500; letter-spacing:0.01em;
  }
  #welcomeStage .brand{
    font-size:clamp(26px,5vw,44px); font-weight:700; letter-spacing:-0.02em;
    color:var(--text); text-align:center; line-height:1.15;
  }
  #welcomeStage .brand .accent{ color:var(--blue); }

  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes stageOut{ to{ opacity:0; } }
  @keyframes stageIn{ to{ opacity:1; } }
  @keyframes splashOut{ to{ opacity:0; visibility:hidden; } }

  /* ---------- Sticky Header & Full Responsive Banner ---------- */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 90;
    padding: 0 0 0 0; /* คงขนาดเท่าเดิมเสมอ ไม่ย่อเมื่อเลื่อนหน้าจอ */
    padding-top: env(safe-area-inset-top, 0px); /* กันโดน notch/Dynamic Island บัง */
    opacity: 0;
  }
  body.intro-done header{ animation: fadeUp 0.8s ease forwards; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .banner-frame {
    width: 100%;
    position: relative;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 0 0 24px 24px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.06);
    transition: all 0.5s cubic-bezier(0.2, 0.8, 0.25, 1);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  /* รูปเต็มความกว้างจอเสมอ ปรับความสูงอัตโนมัติตามชนิดอุปกรณ์ ไม่ถูกตัด ไม่ล้น */
  .banner-frame img {
    width: 100%;
    height: auto;
    max-height: min(55vh, 520px); /* ค่าเริ่มต้นสำหรับจอเดสก์ท็อป/โน้ตบุ๊ก */
    object-fit: contain; /* โชว์ครบทุกสัดส่วนแน่นอน */
    display: block;
    opacity: 0;
    transform-origin: center;
    transition: all 0.5s cubic-bezier(0.2, 0.8, 0.25, 1);
  }
  body.intro-done .banner-frame img{
    animation: bannerFadeIn 1.2s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes bannerFadeIn{
    from{ opacity:0; transform:scale(1.03); }
    to{ opacity:1; transform:scale(1); }
  }

  /* จอมือถือแนวตั้ง (โทรศัพท์) */
  @media (max-width: 480px){
    .banner-frame img{ max-height: 34vh; }
  }
  /* แท็บเล็ต / ไอแพด และมือถือแนวนอน */
  @media (min-width: 481px) and (max-width: 900px){
    .banner-frame img{ max-height: 42vh; }
  }
  /* จอกว้างพิเศษ (จอเดสก์ท็อปใหญ่ / อัลตร้าไวด์) กันแบนเนอร์เตี้ยเกินไป */
  @media (min-width: 1600px){
    .banner-frame img{ max-height: 62vh; }
  }

  /* ภาพโหลดไม่สำเร็จ: ซ่อนภาพอย่างนุ่มนวลแทนไอคอนรูปหัก */
  .banner-frame img.img-error,
  #welcomeStage img.img-error{
    display:none;
  }
  .banner-frame.has-error{ min-height: 96px; }
  .banner-frame.has-error::after{
    content:"PHIMAN SMART OFFICE";
    font-weight:700; letter-spacing:-0.01em; color:var(--text);
    padding:26px 16px;
  }

  /* แสงวาบพาดผ่านแบนเนอร์ */
  .banner-frame .shine{
    position:absolute; top:0; bottom:0; left:-60%; width:40%;
    background:linear-gradient(75deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    transform:skewX(-18deg);
    z-index:3; pointer-events:none;
    opacity:0;
  }
  body.intro-done .banner-frame .shine{
    animation:shineSweep 1.35s ease-in-out forwards;
    animation-delay:0.9s;
  }
  .banner-frame .shine.replay{
    animation:shineSweep 1.1s ease-in-out forwards !important;
    animation-delay:0s !important;
  }
  @keyframes shineSweep{
    0%{ left:-60%; opacity:0; }
    12%{ opacity:1; }
    88%{ opacity:1; }
    100%{ left:130%; opacity:0; }
  }

  /* ---------- main grid ---------- */
  main{
    position:relative; z-index:1;
    max-width:1180px; margin:0 auto;
    padding: calc(var(--header-h) + 40px) 20px 90px;
    transition: padding-top 0.5s cubic-bezier(0.2, 0.8, 0.25, 1);
  }
  .section-label{
    display:flex; align-items:center; gap:10px; margin-bottom:26px;
    opacity:0;
  }
  body.intro-done .section-label{ animation:fadeUp 0.8s ease forwards; }
  .section-label span{
    font-weight:600; letter-spacing:0.04em; font-size:13px;
    color:var(--blue); text-transform:uppercase;
  }

  .search-wrap{
    position:relative;
    max-width:420px;
    margin:0 0 26px;
    opacity:0;
  }
  body.intro-done .search-wrap{ animation:fadeUp 0.8s ease forwards; }
  .search-wrap svg{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--text-secondary); pointer-events:none;
  }
  #systemSearch{
    width:100%;
    padding:13px 40px 13px 44px;
    border-radius:14px;
    border:1px solid var(--card-border);
    background:var(--card-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:var(--shadow-sm);
    font:500 15px/1.4 'Inter','Noto Sans Thai',sans-serif;
    color:var(--text);
    outline:none;
    transition:box-shadow 0.25s, background 0.25s;
  }
  #systemSearch::placeholder{ color:var(--text-secondary); }
  #systemSearch:focus{
    box-shadow:0 0 0 3px rgba(0,113,227,0.18), var(--shadow-sm);
    background:var(--card-bg-hover);
  }
  #searchClear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; border:none; border-radius:50%;
    background:transparent; color:var(--text-secondary);
    display:none; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; line-height:1;
  }
  #searchClear:hover{ background:rgba(0,0,0,0.06); color:var(--text); }
  #searchClear.show{ display:flex; }
  #noResults{
    display:none;
    text-align:center;
    padding:40px 20px;
    color:var(--text-secondary);
    font-size:15px;
  }
  #noResults.show{ display:block; }

  /* ---------- ตารางไอคอนสไตล์แอปมือถือ: ปรับจำนวนคอลัมน์/ขนาดตามอุปกรณ์อัตโนมัติ ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));
    gap:24px 12px;
    justify-items:center;
  }
  /* จอเล็กมาก (มือถือจอแคบ) */
  @media (max-width: 360px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:20px 8px; }
  }
  /* โทรศัพท์ทั่วไปแนวตั้ง */
  @media (min-width: 361px) and (max-width: 480px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(80px, 1fr)); gap:22px 10px; }
  }
  /* แท็บเล็ต / ไอแพด และมือถือแนวนอน */
  @media (min-width: 481px) and (max-width: 900px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:28px 16px; }
  }
  /* โน้ตบุ๊ก / เดสก์ท็อปทั่วไป */
  @media (min-width: 901px) and (max-width: 1599px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(116px, 1fr)); gap:32px 20px; }
  }
  /* จอกว้างพิเศษ */
  @media (min-width: 1600px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(128px, 1fr)); gap:36px 24px; }
  }
  /* ---------- การ์ดไอคอนสไตล์แอปพลิเคชันบนมือถือ ---------- */
  .card{
    position:relative;
    width:100%; max-width:128px;
    background:transparent;
    border:none;
    padding:0;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:8px;
    text-decoration:none; color:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    --ty: 22px;
    transition:transform 0.55s cubic-bezier(.34,1.56,.64,1), opacity 0.5s ease;
    opacity:0; transform:translateY(var(--ty)) scale(0.82);
    will-change:transform;
  }
  .card.in-view{ --ty:0px; opacity:1; transform:translateY(0) scale(1); }
  .card.is-hidden{
    display:none !important;
  }
  .card:focus-visible{ outline:2px solid var(--blue); outline-offset:6px; border-radius:30%; }

  /* เอฟเฟกต์โฮเวอร์ เฉพาะอุปกรณ์ที่มีตัวชี้แบบเมาส์จริง (โน้ตบุ๊ก/เดสก์ท็อป) กันไม่ให้ค้างบนจอสัมผัส */
  @media (hover:hover) and (pointer:fine){
    .card:hover .card-img-wrap{
      transform:translateY(-5px) scale(1.08);
      box-shadow:0 16px 30px rgba(0,0,0,0.16), 0 1px 0 rgba(255,255,255,0.7) inset;
    }
    .card:hover .card-label{ color:var(--blue); }
  }
  /* เอฟเฟกต์ตอนกด/แตะ เหมือนกดไอคอนแอปจริงบนมือถือ */
  .card:active .card-img-wrap{
    transform:scale(0.90);
    box-shadow:0 4px 10px rgba(0,0,0,0.10), 0 1px 0 rgba(255,255,255,0.5) inset;
    transition-duration:0.12s;
  }
  .card:active .card-label{ opacity:0.7; }

  .card-img-wrap{
    position:relative;
    width:100%; aspect-ratio:1/1;
    border-radius:26%; /* squircle โค้งมนแบบไอคอนแอปบนสมาร์ทโฟน */
    overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,0.92), rgba(255,255,255,0.55));
    box-shadow:0 8px 18px rgba(0,0,0,0.10), 0 1px 0 rgba(255,255,255,0.6) inset;
    transition:transform 0.35s cubic-bezier(.2,.8,.25,1), box-shadow 0.35s;
  }
  .card-img-wrap::after{
    /* แสงมันวาวมุมบนแบบกระจก คล้ายไอคอน iOS/Android */
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(155deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 38%);
    pointer-events:none;
  }
  .card-img-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
    position:relative; z-index:0;
  }
  /* คลื่นแตะ (ripple) เมื่อผู้ใช้กดไอคอน */
  .card-img-wrap .ripple{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.55);
    transform:scale(0); opacity:0.9;
    animation:rippleAnim 0.6s ease-out forwards;
    pointer-events:none; z-index:1;
  }
  @keyframes rippleAnim{
    to{ transform:scale(2.8); opacity:0; }
  }

  .card-label{
    font:600 clamp(11px,2.6vw,13px)/1.28 'Inter','Noto Sans Thai',sans-serif;
    color:var(--text);
    max-width:100%;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    transition:color 0.25s, opacity 0.2s;
  }

  @media (prefers-reduced-motion: reduce){
    .card-img-wrap .ripple{ display:none; }
  }

  footer{
    position:relative; z-index:1;
    text-align:center; padding:30px 20px 46px;
    font-size:13px; color:var(--text-secondary);
    border-top:1px solid var(--divider);
    opacity:0;
  }
  body.intro-done footer{ animation:fadeUp 0.8s ease forwards; }
  footer .accent{color:var(--blue); font-weight:600;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
    #splash{display:none;}
    .aurora span{animation:none;}
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>

  <div id="helloStage">

/* ---------- Intro sequence: reveal main content reliably ---------- */
(function(){
  const splash = document.getElementById('splash');
  const skipBtn = document.getElementById('skipIntro');
  const header = document.getElementById('siteHeader');
  const main = document.querySelector('main');
  let done = false;

  function finishIntro(){
    if (done) return;
    done = true;
    document.body.classList.add('intro-done');
    header.removeAttribute('inert');
    main.removeAttribute('inert');
    splash.setAttribute('aria-hidden', 'true');
    splash.style.pointerEvents = 'none';
    skipBtn.style.display = 'none';
  }

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReduced) {
    // เมื่อผู้ใช้ตั้งค่าลดการเคลื่อนไหว #splash จะถูกซ่อนทันทีด้วย CSS
    // และ animationend จะไม่ทำงาน จึงต้องเปิดเนื้อหาหลักทันทีที่นี่
    skipBtn.style.display = 'none';
    finishIntro();
  } else {
    skipBtn.addEventListener('click', () => {
      splash.classList.add('skip-out');
      finishIntro();
    });
    splash.addEventListener('animationend', (e) => {
      if (e.target === splash) finishIntro();
    });
    // เผื่อกรณี animationend ไม่ยิง (เช่น แท็บถูกซ่อนตอนโหลด) ให้เปิดเนื้อหาแน่นอน
    window.setTimeout(finishIntro, 11500);
  }
})();

(function(){
  const header = document.getElementById('siteHeader');

  function updateHeaderHeight(){
    document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');

  updateHeaderHeight();
  window.addEventListener('load', updateHeaderHeight);

  if ('ResizeObserver' in window) {

  } else {

    window.addEventListener('scroll', updateHeaderHeight, { passive: true });
  }
})();

const grid = document.getElementById('systemGrid');
const prefersReducedMotionForRipple = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

systems.forEach((sys, i) => {
  const a = document.createElement('a');
  a.href = sys.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.className = "card";
  a.dataset.index = i;
  a.dataset.name = sys.name;
  a.innerHTML = `
    <div class="card-img-wrap"><img src="${sys.img}" alt="${sys.name}" loading="lazy"></div>
    <span class="card-label">${sys.name}</span>
  `;
  grid.appendChild(a);

  // เอฟเฟกต์คลื่นแตะ (ripple) เหมือนแตะไอคอนแอปบนมือถือจริง
  if (!prefersReducedMotionForRipple) {
    const wrap = a.querySelector('.card-img-wrap');
    a.addEventListener('pointerdown', (e) => {
      const rect = wrap.getBoundingClientRect();
      const size = rect.width * 1.3;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      wrap.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });
  }
});

/* ---------- ค้นหาระบบ ---------- */
(function(){
  const input = document.getElementById('systemSearch');
  const clearBtn = document.getElementById('searchClear');
  const noResults = document.getElementById('noResults');
  const cards = Array.from(document.querySelectorAll('.card'));

  function normalize(str){
    return (str || '').toLowerCase().trim();
  }

  function applyFilter(){
    const q = normalize(input.value);
    clearBtn.classList.toggle('show', q.length > 0);

    let visibleCount = 0;
    cards.forEach(card => {
      const name = normalize(card.dataset.name);
      const match = q === '' || name.includes(q);
      card.classList.toggle('is-hidden', !match);
      if (match) visibleCount++;
    });

    noResults.classList.toggle('show', visibleCount === 0);
  }

  input.addEventListener('input', applyFilter);
  clearBtn.addEventListener('click', () => {
    input.value = '';
    applyFilter();
    input.focus();
  });
})();

/* ---------- เปิดเผยการ์ดแบบไล่ลำดับเมื่อเลื่อนเข้ามาในจอ ---------- */
(function(){
  const cards = Array.from(document.querySelectorAll('.card'));
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!('IntersectionObserver' in window) || prefersReduced) {
    cards.forEach(c => c.classList.add('in-view'));
    return;
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const i = Number(el.dataset.index) % 12; // stagger จำกัดไว้ไม่ให้การ์ดท้ายๆ รอนานเกินไป
        el.style.transitionDelay = (i * 0.06) + "s";
        el.classList.add('in-view');
        io.unobserve(el);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

  cards.forEach(c => io.observe(c));
})();
